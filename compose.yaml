# compose.yaml — spindle + rustfs: the bucket-backed stack (DEVELOPMENT example).
#
#   docker compose up -d --build        # build the image and start everything
#   open http://localhost:8080/admin    # configure; git push auto-creates repos
#
# rustfs is an S3-compatible object store (the same fixture `make dev-store`
# and the CI s3-contract job use). The fixed keys below are DEV KEYS — never
# point this stack at anything you care about.
#
# spindle is configured through the SPINDLE__* env overlay
# (docs/go/11_config_cli.md §3.2). **FIRST RUN IS RESTRICTED:** without a
# complete OIDC set the container serves only /admin and the health endpoints
# (everything else 503). Open http://localhost:8080/admin, fill the OIDC card,
# Save and restart — or supply the whole set below, which needs an IdP client
# whose redirect URI is <public-url>/_auth/callback:
#
#   SPINDLE__SERVER__AUTH__ISSUER=https://id.example.com
#   SPINDLE__SERVER__AUTH__ALLOWED_DOMAINS=["example.com"]
#   SPINDLE__SERVER__AUTH__OAUTH_CLIENT_ID=spindle
#   SPINDLE__SERVER__AUTH__OAUTH_CLIENT_SECRET=...
#   SPINDLE__SERVER__AUTH__SESSION_SECRET=<openssl rand -hex 32>
#   SPINDLE__SERVER__AUTH__ADMIN_GROUPS=["spindle-admin"]
#   SPINDLE__SERVER__PUBLIC_URL=https://git.example.com
#
# Put your administrators in the IdP group before the first sign-in.

name: spindle-rustfs

services:
  rustfs:
    image: rustfs/rustfs:latest
    ports: ["9000:9000", "9001:9001"] # S3 API / web console
    environment:
      RUSTFS_ACCESS_KEY: walgit-dev
      RUSTFS_SECRET_KEY: walgit-dev-secret
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: /data
    volumes: [rustfs-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, idempotent bucket creation.
  create-bucket:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: walgit-dev
      AWS_SECRET_ACCESS_KEY: walgit-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: []
    command: >
      sh -c "aws --endpoint-url http://rustfs:9000 s3 mb s3://spindle-test 2>/dev/null || true &&
             aws --endpoint-url http://rustfs:9000 s3 ls"
    restart: "no"

  spindle:
    build: .
    image: spindle:local
    depends_on:
      rustfs: { condition: service_healthy }
      create-bucket: { condition: service_completed_successfully }
    environment:
      # S3 store on rustfs (SPINDLE__SECTION__KEY env overlay, docs/go/11 §3.2).
      SPINDLE__STORE__BACKEND: s3
      SPINDLE__STORE__S3__ENDPOINT: http://rustfs:9000
      SPINDLE__STORE__S3__REGION: us-east-1
      SPINDLE__STORE__BUCKET: spindle-test
      # rustfs/MinIO require path-style addressing (docs/go/03_store_backends.md §2).
      SPINDLE__STORE__S3__FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: walgit-dev
      AWS_SECRET_ACCESS_KEY: walgit-dev-secret
      # Authentication: OIDC only (docs/PLAN-OIDC-ONLY.md). Add the
      # SPINDLE__SERVER__AUTH__* set from the header comment above to boot
      # normally; otherwise this container stays in the restricted first run.
      # SSH git transport (17_ssh.md): keys via the /keys page; the host key
      # persists in the data volume (TOFU).
      SPINDLE__SERVER__SSH__LISTEN: 0.0.0.0:2222
    ports: ["8080:8080", "2222:2222"]
    volumes: [spindle-data:/var/lib/spindle]
    restart: unless-stopped
    healthcheck:
      # /healthz and /readyz both answer in the restricted first run: /readyz
      # reports 200 with status "restricted" because the Administration surface
      # is what it serves — route it, never gate it out.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  rustfs-data: {}
  spindle-data: {}
