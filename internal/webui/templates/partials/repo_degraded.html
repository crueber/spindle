{{define "repo_degraded"}}
{{if .Degraded}}
<!-- Degraded banner (issue #209): warning tone, never a toast, never blocks
     navigation. Pushes of NEW refs still work; reads of missing objects 404
     inline on their pages. -->
<div class="degraded-banner mb-4 flex flex-wrap items-center gap-x-2 gap-y-1 border border-[var(--pd-warn)] bg-[color-mix(in_srgb,var(--pd-warn)_10%,var(--pd-surface))] px-3 py-2 text-sm" role="status">
  <span class="chip chip-draft">degraded</span>
  <span class="text-[var(--pd-text-2)]">Some objects are missing (fsck: {{.MissingTotal}} missing). Reads may fail; pushes of new refs still work. Details in</span>
  <a class="link font-mono text-[11px]" href="/{{.Full}}/settings#wal">Settings → WAL</a>.
</div>
{{end}}
{{end}}
