# compose.standalone.yml — spindle ALONE: filesystem store, zero external services.
#
#   docker compose -f compose.standalone.yml up -d --build
#   open http://localhost:8080/admin    # configure auth, store, everything
#
# Repositories live in the spindle-data volume (the server's filesystem store
# under /var/lib/spindle/store). No object store, no database — the only
# durable state is the mounted volume, so backups are `docker run --rm -v
# spindle-standalone_spindle-data:/data alpine tar cz -C /data` of that volume.
#
# FIRST RUN IS RESTRICTED: there is no open mode. The container serves only
# /admin and the health endpoints until OIDC is configured (everything else
# 503). Open /admin, fill the OIDC card (issuer, allowed email domain, client
# id/secret, session secret, admin group), Save, restart. Prerequisites at the
# IdP: a client whose redirect URI is <public-url>/_auth/callback, and a group
# (default `spindle-admin`) containing your administrators.
#
# To pre-configure instead, mount a config file:
#   volumes:
#     - spindle-data:/var/lib/spindle
#     - ./spindle.toml:/var/lib/spindle/spindle.toml:ro
# (server.listen inside it must stay 0.0.0.0:8080 to be reachable.)

name: spindle-standalone

services:
  spindle:
    build: .
    image: spindle:local
    ports: ["8080:8080", "2222:2222"]
    environment:
      # SSH git transport (17_ssh.md): clone/fetch/push over ssh://. Keys are
      # added through the /keys page by the signed-in user; the host key
      # auto-generates into the data volume, so clients can pin it across
      # restarts (TOFU). The listener stays OFF in the restricted first run.
      SPINDLE__SERVER__SSH__LISTEN: 0.0.0.0:2222
    volumes: [spindle-data:/var/lib/spindle]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  spindle-data: {}
