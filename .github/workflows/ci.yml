name: CI
# Installed by the publish flow (scripts/publish/ci.yml). Same gate as the development
# repository: web build + headless JS tests, vet, race, the ≥95 % per-package coverage
# gate, e2e against the real git binary, the filesystem contract, the S3 contract
# against a rustfs service, and the rendered accessibility floor (make a11y) driven by
# a real browser.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Embed guard (Forgejo #300): fresh checkouts must compile without a prior web
      # build — go:embed all:dist fails on a missing directory.
      - name: embed guard (web/dist/.keep present)
        run: 'test -f web/dist/.keep || (echo "FAIL: web/dist/.keep missing (see #300)" && exit 1)'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build the web (embedded dist)
        run: pnpm --dir web install --frozen-lockfile && make web
      - name: headless JS tests
        run: node --test "web/test/unit/*.test.js"

  gate:
    # The prepped toolchain image (docker/ci.Dockerfile): git 2.5x, node, npm, gcc,
    # openssh-client, chromium and the fonts are installed once, at image build. The
    # GitHub workflow installs nothing at run time — no apt, no PPA, no Chrome
    # repository. Rebuild and re-pin the digest when docker/ci.Dockerfile moves.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crueber/spindle-ci@sha256:21d0314ddf33a0a5938aaa27d07d755927a67d0500a9beb89d5c90a1051a50cc
      credentials:
        username: ${{ secrets.GHCR_USER }}
        password: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: build the web once (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      # Several tests assert that an unwritable/read-only path FAILS. Root bypasses
      # permission bits, so the suite runs as a normal user — the same shape as the
      # development gate (docs/go/15_testing.md §6.1).
      - name: unprivileged test user
        run: |
          useradd -m -u 1001 ci
          chown -R ci:ci .
      - name: gofmt + go vet + go build
        run: su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' make -o web vet" ci
      - name: fast tier under the race detector
        # PRs race the packages that own shared state; a push to main (or a tag) runs
        # the full tier (docs/go/15_testing.md §6.1).
        run: |
          case "${{ github.event_name }}" in
            push|workflow_dispatch) target=race ;;
            *) target=race-pr ;;
          esac
          su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' make -o web $target" ci
      - name: coverage gate (>=95 % per internal package, D7)
        run: su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' make cover" ci
      - name: smart-HTTP end-to-end against the real git binary
        run: su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' make e2e" ci
      - name: store contract — memory + filesystem (always)
        run: su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' make contract" ci
      - name: parity gate + corpus parse tier (no docker)
        run: su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' make -o web parity" ci

  a11y:
    # The rendered accessibility floor (AGENTS.md §2, docs/go/15_testing.md §6.6): the
    # real binary driven through headless Chromium over CDP across the fixed page set at
    # 390 px and desktop. Same prepped image, same unprivileged user; the browser is
    # in the image, not installed here. A missing or broken browser is a FAILURE, never
    # a skip (internal/e2e/a11y_test.go TestA11yPreflight).
    runs-on: ubuntu-latest
    needs: gate
    container:
      image: ghcr.io/crueber/spindle-ci@sha256:21d0314ddf33a0a5938aaa27d07d755927a67d0500a9beb89d5c90a1051a50cc
      credentials:
        username: ${{ secrets.GHCR_USER }}
        password: ${{ secrets.GHCR_TOKEN }}
    env:
      SPINDLE_A11Y: "1"
      # Debian chromium in the image; a job container has no user namespaces for the
      # sandbox, so the CI-only no-sandbox switch is required (same as the dev gate).
      SPINDLE_CHROMIUM: /usr/bin/chromium
      SPINDLE_CHROMIUM_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: build the web once (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: unprivileged test user
        run: |
          useradd -m -u 1001 ci
          chown -R ci:ci .
      - name: rendered accessibility smoke (headless Chromium over CDP)
        run: su -s /bin/sh -c "cd '$PWD' && HOME=/home/ci PATH='$PATH' SPINDLE_A11Y=1 SPINDLE_CHROMIUM=/usr/bin/chromium SPINDLE_CHROMIUM_NO_SANDBOX=1 make -o web a11y" ci

  s3-contract:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74 # rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: walgit-dev
          RUSTFS_SECRET_KEY: walgit-dev-secret
        ports:
          - 9000:9000
    env:
      SPINDLE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SPINDLE_TEST_S3_ACCESS_KEY: walgit-dev
      SPINDLE_TEST_S3_SECRET_KEY: walgit-dev-secret
      SPINDLE_TEST_S3_BUCKET: spindle-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build the web (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: provision the bucket (the store never creates buckets)
        run: ./scripts/ci-s3-bucket.sh
      - run: make contract-s3
