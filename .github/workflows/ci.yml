name: CI
# Installed by the publish flow (scripts/publish/ci.yml). Same gate as the development
# repository: web build + headless JS tests, vet, race, the ≥95 % per-package coverage
# gate, e2e against the real git binary, the filesystem contract, and the S3 contract
# against a rustfs service.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Embed guard (Forgejo #300): fresh checkouts must compile without a prior web
      # build — go:embed all:dist fails on a missing directory.
      - name: embed guard (web/dist/.keep present)
        run: 'test -f web/dist/.keep || (echo "FAIL: web/dist/.keep missing (see #300)" && exit 1)'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build the web (embedded dist)
        run: pnpm --dir web install --frozen-lockfile && make web
      - name: headless JS tests
        run: node --test "web/test/unit/*.test.js"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The suite needs git >= 2.47 (internal/e2e) and the stock runner image is older
      # than that; the git-core PPA is the fastest way to a current git.
      - name: git >= 2.47
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq git
          git --version
      - name: build the web once (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: gofmt + go vet + go build
        run: make -o web vet
      - name: fast tier under the race detector
        run: make -o web race
      - name: coverage gate (≥95 % per internal package, D7)
        run: make cover
      - name: smart-HTTP end-to-end against the real git binary
        run: make e2e
      - name: store contract — memory + filesystem (always)
        run: make contract

  s3-contract:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74 # rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: walgit-dev
          RUSTFS_SECRET_KEY: walgit-dev-secret
        ports:
          - 9000:9000
    env:
      WALHUB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      WALHUB_TEST_S3_ACCESS_KEY: walgit-dev
      WALHUB_TEST_S3_SECRET_KEY: walgit-dev-secret
      WALHUB_TEST_S3_BUCKET: walhub-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build the web (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: provision the bucket (the store never creates buckets)
        run: ./scripts/ci-s3-bucket.sh
      - run: make contract-s3
