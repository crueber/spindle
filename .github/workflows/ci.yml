name: CI
# Installed by the publish flow (scripts/publish/ci.yml). Same gate as the development
# repository: web build + headless JS tests, vet, race, the ≥95 % per-package coverage
# gate, e2e against the real git binary, the filesystem contract, the S3 contract
# against a rustfs service, and the rendered accessibility floor (make a11y) driven by
# a real browser.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Embed guard (Forgejo #300): fresh checkouts must compile without a prior web
      # build — go:embed all:dist fails on a missing directory.
      - name: embed guard (web/dist/.keep present)
        run: 'test -f web/dist/.keep || (echo "FAIL: web/dist/.keep missing (see #300)" && exit 1)'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build the web (embedded dist)
        run: pnpm --dir web install --frozen-lockfile && make web
      - name: headless JS tests
        run: node --test "web/test/unit/*.test.js"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The suite needs git >= 2.47 (internal/e2e) and the stock runner image is older
      # than that; the git-core PPA is the fastest way to a current git.
      - name: git >= 2.47
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq git
          git --version
      - name: build the web once (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: gofmt + go vet + go build
        run: make -o web vet
      - name: fast tier under the race detector
        # PRs race the packages that own shared state; a push to main runs the
        # full tier (docs/go/15_testing.md §6.1).
        run: |
          case "${{ github.event_name }}" in
            push|workflow_dispatch) target=race ;;
            *) target=race-pr ;;
          esac
          make -o web $target
      - name: coverage gate (≥95 % per internal package, D7)
        run: make cover
      - name: smart-HTTP end-to-end against the real git binary
        run: make e2e
      - name: store contract — memory + filesystem (always)
        run: make contract

  a11y:
    # The rendered accessibility floor (AGENTS.md §2, docs/go/15_testing.md §6.6): the
    # real binary driven through headless Chromium over CDP across the fixed page set at
    # 390 px and desktop. Its own job because it needs a browser; after the gate so a
    # red gate does not pay for one. This is the same tier the development gate runs —
    # `make a11y` with SPINDLE_A11Y=1, where a missing or broken browser is a FAILURE,
    # never a skip (internal/e2e/a11y_test.go TestA11yPreflight).
    runs-on: ubuntu-latest
    needs: gate
    env:
      SPINDLE_A11Y: "1"
      # Name the binary instead of relying on the PATH probe: the fix must be visible
      # in this file, not inferred from the runner image.
      SPINDLE_CHROMIUM: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: git >= 2.47
        # The e2e harness asserts a modern git before it drives the pages
        # (requireModernGit); the stock runner image is older than that.
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq git
          git --version
      - name: Chromium (the browser the floor needs)
        # The development gate installs Debian's `chromium` into a job container. A
        # hosted GitHub runner is an Ubuntu 24.04 VM, where `chromium` is only a snap
        # stub that cannot start in CI; Google Chrome is a Chromium build and speaks
        # the same DevTools protocol surface the test drives (`make a11y` also probes
        # google-chrome-stable on PATH). Install it from Google's apt repository so the
        # browser is provisioned by this job, not assumed from the image. No
        # SPINDLE_CHROMIUM_NO_SANDBOX here: that exists because a job container has no
        # user namespaces; the VM runs the browser with its sandbox on.
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends google-chrome-stable fonts-dejavu-core
          google-chrome-stable --version
      - name: build the web once (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: rendered accessibility smoke (headless Chromium over CDP)
        run: make -o web a11y

  s3-contract:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74 # rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: walgit-dev
          RUSTFS_SECRET_KEY: walgit-dev-secret
        ports:
          - 9000:9000
    env:
      SPINDLE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SPINDLE_TEST_S3_ACCESS_KEY: walgit-dev
      SPINDLE_TEST_S3_SECRET_KEY: walgit-dev-secret
      SPINDLE_TEST_S3_BUCKET: spindle-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build the web (go:embed all:dist)
        run: |
          pnpm --dir web install --frozen-lockfile
          make web
          touch web/dist/.keep
      - name: provision the bucket (the store never creates buckets)
        run: ./scripts/ci-s3-bucket.sh
      - run: make contract-s3
