name: docker image
# Installed by the publish flow (scripts/publish/docker-image.yml). Builds the server
# image and publishes it to GHCR — the package name is the pull path users already have:
#   ghcr.io/crueber/spindle:latest        (default branch)
#   ghcr.io/crueber/spindle:sha-<short>   (every push)
#   ghcr.io/crueber/spindle:<semver>      (tags v*)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crueber/spindle
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SPINDLE_BUILD_SHA=${{ github.sha }}
