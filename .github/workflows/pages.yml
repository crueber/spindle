name: pages
# Publishes the project website (site/ + docs/demo.webm) to GitHub Pages:
# https://crueber.github.io/spindle/
#
# Staged by scripts/site-stage.sh — the same script `make site` / `make site-preview` run
# locally — and gated by scripts/site-check.sh (publish-gate strings, referenced assets,
# one h1, alt text, no off-origin assets). No build step: the staged directory IS the site.
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions. Without it
# configure-pages fails; enable it, then run this workflow by hand (Actions -> pages -> Run
# workflow). A release created by another workflow with the built-in GITHUB_TOKEN does not
# start new runs, so the push trigger and workflow_dispatch are what normally deploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/demo.webm'
      - 'scripts/site-stage.sh'
      - 'scripts/site-check.sh'
      - 'scripts/publish/pages.yml'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The artifact is uploaded here and deployed by the second job on purpose. Running
  # upload-pages-artifact and deploy-pages back-to-back in one job intermittently
  # fails with "Found 0 artifact(s)" although the artifact exists: the deployment job
  # can query the artifact service before the freshly-finalized artifact is visible.
  # A job boundary is the settle window; the upload job's success is the precondition.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check the site
        run: bash scripts/site-check.sh
      - name: stage the site
        run: bash scripts/site-stage.sh dist/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
          include-hidden-files: true   # keeps .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
